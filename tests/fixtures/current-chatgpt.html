<main>
  <div data-turn-key="turn-one">
    <div data-content-search-turn-key="fallback-turn-1">
      <div data-markdown-copy="exclude">Timestamp</div>
      <div data-talvt-turn-state="complete">
        <div data-chatgpt-search-unit-key="fallback-turn-1:0:user">
          <div data-content-search-unit-key="fallback-turn-1:0:user">
            <div data-user-message-bubble="true"><p id="question">User question</p></div>
          </div>
        </div>
        <div hidden><div data-markdown-text-style="assistant-message">Hidden reasoning</div></div>
        <div data-chatgpt-search-unit-key="fallback-turn-1:2:assistant" data-content-search-unit-key="fallback-turn-1:2:assistant">
          <div data-chatgpt-selection-message-id="answer-one">
            <div data-markdown-text-style="assistant-message">
              <div data-dil-source-message-id="answer-one" data-markdown-copy="contents">
                <div data-dil-message-id="answer-one" data-d-direction="col">
                  <h2 data-d-component="title">Answer title</h2>
                  <p data-d-component="text" id="answer">Selected answer <span data-d-component="text" data-d-default-strong data-d-inline>bold</span> and <span data-d-component="text" data-d-font-style="italic" data-d-inline>italic</span>.</p>
                  <p data-d-component="text">Inline <span data-d-component="math"><span class="katex"><annotation encoding="application/x-tex">q(s)</annotation><span class="katex-html" aria-hidden="true">duplicate</span></span></span>.</p>
                  <div data-d-component="math" data-d-block><span class="katex-display"><span class="katex"><annotation encoding="application/x-tex">q = r_0 - \delta</annotation><span aria-hidden="true">duplicate</span></span></span></div>
                  <div data-code-block="true" data-markdown-copy="code-block">
                    <div data-markdown-copy="exclude" class="sticky"><div>Python</div><button>Copy code</button><button>Run</button></div>
                    <div class="cm-editor"><div class="cm-content" contenteditable="true" data-language="python"><div class="cm-line">q = 1</div><div class="cm-line"><br></div><div class="cm-line">print(q)</div></div></div>
                  </div>
                  <div data-d-component="table"><table><tr><th data-d-component="table-cell">Symbol</th><th>Meaning</th></tr><tr><td>q</td><td>Offset</td></tr></table></div>
                </div>
              </div>
            </div>
          </div>
          <div data-markdown-copy="exclude">Answer toolbar</div>
        </div>
        <div data-content-search-unit-key="fallback-turn-1:3:assistant">
          <div data-markdown-text-style="assistant-message"><p id="other-answer">Different assistant unit in the same turn</p></div>
        </div>
      </div>
    </div>
  </div>
</main>
